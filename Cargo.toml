[package]
name = "bevy_settings_plus"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Capability-aware extension to bevy_settings: adapter detection, platform defaults, caps clamping, engine bindings."
repository = "https://github.com/pavlov-net/bevy_settings_plus"
readme = "README.md"
keywords = ["bevy", "settings", "config", "graphics"]
categories = ["game-development", "config"]

[features]
# Needs the NVIDIA DLSS SDK at build time, so CI and docs.rs build without it.
dlss = ["bevy_anti_alias/dlss"]

[dependencies]
bevy_app = "0.20.0"
bevy_ecs = "0.20.0"
bevy_reflect = "0.20.0"
bevy_render = "0.20.0"
bevy_window = "0.20.0"
bevy_anti_alias = "0.20.0"
bevy_log = "0.20.0"
# The package is `bevy-settings`; the crate is imported as `bevy_settings`.
bevy-settings = "0.20.0"
wgpu-types = { version = "30", default-features = false }

[dev-dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["3d"] }
